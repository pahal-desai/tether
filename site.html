<html>

<head>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico ">
    <title>Tether</title>
    <link rel="stylesheet" href="signup.css">
    <script>
        const isauthpending = sessionStorage.getItem('authpending');
        sessionStorage.removeItem('authpending');

        const currenthash = window.location.hash;
        if (currenthash && currenthash.includes('error=')) {
            const hashparams = new URLSearchParams(currenthash.substring(1));
            const errordesc = hashparams.get('error_description') || hashparams.get('error');
            alert(errordesc);
            window.history.replaceState(null, '', window.location.pathname);
        }

        if (currenthash && currenthash.includes('access_token=') && isauthpending) {
            const hashparams = new URLSearchParams(currenthash.substring(1));
            const accesstoken = hashparams.get('access_token');
            if (accesstoken) {
                localStorage.setItem('accesstoken', accesstoken);
            }
            window.history.replaceState(null, '', window.location.pathname);
        } else if (currenthash && currenthash.includes('access_token=')) {
            window.history.replaceState(null, '', window.location.pathname);
        }

        const savedtoken = localStorage.getItem('accesstoken');
        if (!savedtoken) {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: aliceblue;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            border-right: 1px solid #ccc;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            background-color: transparent;
        }

        .sidebar .logo {
            width: 130px;
            height: auto;
            margin-bottom: 15px;
        }

        .createbutton {
            border: none;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            outline: none;
            background-color: #5B4CF6;
            color: white;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-bottom: 8px;
        }

        .otherbuttons {
            background-color: transparent;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            outline: none;
            color: #333;
            font-size: 15px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: left;
            width: 100%;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .otherbuttons:hover {
            background-color: white;
        }

        .maincontent {
            margin-left: 220px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <a href="#"><img class="logo" src="assets/logo.png"></a>
        <button class="createbutton">+ Create</button>
        <button class="otherbuttons">Home</button>
        <button class="otherbuttons">Following</button>
        <button class="otherbuttons">Explore</button>
    </div>

    <div class="maincontent">
        <div class="login" align="center">
            <h3>Welcome to Tether</h3>
            <p
                style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; font-size: 15px; margin: 15px 0;">
                You are now on the main site.</p>
            <hr>
            <a href="login.html">Sign Out</a>
        </div>
    </div>
    <script>
        const signoutlink = document.querySelector('a[href="login.html"]');
        if (signoutlink) {
            signoutlink.addEventListener('click', function () {
                localStorage.removeItem('accesstoken');
            });
        }
    </script>
</body>

</html>
