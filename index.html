<html>

<head>
    <title>Tether</title>
    <style>
        @font-face {
            font-family: 'coolfonts';
            src: url('assets/Kugile_Demo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .mainthing {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 73vh;
            margin-right: 30%;
            margin-left: 30%;
        }

        .logo {
            width: 140px;
            height: auto;
        }

        body {
            background-color: aliceblue;
        }

        .mainthing em {
            font-size: xxx-large;
        }

        .mainthing p {
            color: gray;
            text-align: justify;
        }

        .upperarea {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mainthing a,
        .buttons a {
            background-color: #5B4CF6;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-left: 10px;
            display: inline-block;
        }

        .mainthing a:hover,
        .buttons a:hover {
            transform: scale(1.04);
            /*a very particular number ikr. I was just playing around with the values and this number looked the best*/
            transition: 0.2s;
        }
    </style>
</head>

<body>
    <div class="upperarea">
        <a href="#"><img class="logo" src="assets/logo.png"></a>
        <div class="buttons">
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="mainthing">
        <em style="font-family: 'coolfonts'; font-weight: normal;">
            Welcome to Tether!</em>
        <p
            style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">
            Tether is a social discovery platform built around shared interests. Instead of connecting with people
            randomly, Tether helps you discover people, communities, and activities based on the things you actually
            care about.</p>
        <a href="signup.html">Get Started</a>
    </div>
</body>

</html>
