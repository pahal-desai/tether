<html>

<head>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico ">
    <title>Tether — Explore</title>
    <link rel="stylesheet" href="signup.css">
    <script>
        const savedtoken = localStorage.getItem('accesstoken');
        if (!savedtoken) {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            background-color: aliceblue;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            border-right: 1px solid #ccc;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            background-color: transparent;
        }

        .sidebartop {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar .logo {
            width: 130px;
            height: auto;
            margin-bottom: 15px;
        }

        .createbutton {
            border: none;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            outline: none;
            background-color: #5B4CF6;
            color: white;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-bottom: 8px;
        }

        .otherbuttons {
            background-color: transparent;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            outline: none;
            color: #333;
            font-size: 15px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: left;
            width: 100%;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .otherbuttons:hover {
            background-color: white;
        }

        .sidebaraccount {
            border-top: 1px solid #dcdcdc;
            padding-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .accountinfo {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .accountavatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #5B4CF6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            flex-shrink: 0;
        }

        .accountmeta {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .accountname {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .signoutbutton {
            border: 1px solid #e2e8f0;
            background-color: white;
            color: #e53e3e;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }

        .signoutbutton:hover {
            background-color: #fff5f5;
            border-color: #feb2b2;
            color: #c53030;
        }

        .maincontent {
            margin-left: 220px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .modaloverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modalcontent {
            background-color: white;
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            box-sizing: border-box;
        }

        .modalheader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modalheader h3 {
            margin: 0;
            font-size: 18px;
        }

        .closebutton {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            outline: none;
            padding: 0;
            line-height: 1;
        }

        .closebutton:hover {
            color: #000;
        }

        .posttextarea {
            width: 100%;
            height: 120px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .posttextarea:focus {
            border-color: #5B4CF6;
        }

        .publishbutton {
            background-color: #5B4CF6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            float: right;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebartop">
            <a href="site.html"><img class="logo" src="assets/logo.png"></a>
            <button class="createbutton">+ Create</button>
            <button class="otherbuttons" onclick="window.location.href='site.html'">Home</button>
            <button class="otherbuttons" onclick="window.location.href='following.html'">Following</button>
            <button class="otherbuttons" onclick="window.location.href='explore.html'">Explore</button>
        </div>
        <div class="sidebaraccount">
            <div class="accountinfo">
                <div class="accountavatar">U</div>
                <div class="accountmeta">
                    <span class="accountname">Account</span>
                </div>
            </div>
            <button class="signoutbutton" id="signoutbutton">Sign Out</button>
        </div>
    </div>

    <div class="maincontent">
        <div class="login" align="center">
            <h3>Explore</h3>
            <p
                style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; font-size: 15px; margin: 15px 0;">
                Discover new topics, communities, and people based on shared interests.</p>
        </div>
    </div>

    <div class="modaloverlay" id="postmodal">
        <div class="modalcontent">
            <div class="modalheader">
                <h3>Create Post</h3>
                <button class="closebutton" id="closemodal">&times;</button>
            </div>
            <textarea class="posttextarea" placeholder="What's on your mind?"></textarea>
            <button class="publishbutton" id="publishpost">Post</button>
        </div>
    </div>

    <script>
        const openmodalbutton = document.querySelector('.createbutton');
        const modaloverlay = document.querySelector('#postmodal');
        const closemodalbutton = document.querySelector('#closemodal');
        const publishbutton = document.querySelector('#publishpost');

        if (openmodalbutton && modaloverlay) {
            openmodalbutton.addEventListener('click', function () {
                modaloverlay.style.display = 'flex';
            });
        }

        if (closemodalbutton && modaloverlay) {
            closemodalbutton.addEventListener('click', function () {
                modaloverlay.style.display = 'none';
            });
        }

        if (modaloverlay) {
            modaloverlay.addEventListener('click', function (overlayevent) {
                if (overlayevent.target === modaloverlay) {
                    modaloverlay.style.display = 'none';
                }
            });
        }

        if (publishbutton && modaloverlay) {
            publishbutton.addEventListener('click', function () {
                const textarea = modaloverlay.querySelector('textarea');
                if (textarea) {
                    textarea.value = '';
                }
                modaloverlay.style.display = 'none';
            });
        }

        const signoutbutton = document.querySelector('#signoutbutton');
        if (signoutbutton) {
            signoutbutton.addEventListener('click', function () {
                localStorage.removeItem('accesstoken');
                window.location.href = 'login.html';
            });
        }
    </script>
</body>

</html>
